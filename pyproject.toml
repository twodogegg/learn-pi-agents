[project]
name = "learn-openai-agents"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["openai-agents==0.24.0", "tzdata>=2025.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["common"]

[tool.setuptools.packages.find]
include = ["agent_*"]
